name: ngcomengineer
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.6
  popover: ^0.3.0
  http: ^1.2.1
  # vibration: ^1.9.0 # Incompatible with newer Flutter versions
  google_fonts: ^6.2.1
  permission_handler: ^11.3.0
  fluttertoast: ^8.2.5
  smooth_page_indicator: ^1.1.0
  font_awesome_flutter: ^10.7.0
  image_picker: ^1.0.0
  url_launcher: ^6.1.12
  flutter_animate: ^4.5.0
  device_info_plus: ^10.1.0
  intl: ^0.19.0
  provider: ^6.0.4
  flashy_tab_bar2: ^0.0.10
  shared_preferences: ^2.0.13
  geolocator: ^12.0.0
  flutter_background_service: ^5.0.11
  flutter_background_service_android: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo-main.png"
  min_sdk_android: 21




flutter:
 
  uses-material-design: true

  
  assets:
    - lib/images/
    - assets/images/
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg